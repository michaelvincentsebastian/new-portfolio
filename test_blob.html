<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Data Blob Background</title>
    <style>
        /* --- TEMA DARK BLUE (Default) --- */
        :root {
            --bg-base: #030712;
            --blob-1: linear-gradient(135deg, #1e3a8a, #4338ca);
            --blob-2: linear-gradient(135deg, #0f172a, #0ea5e9);
            --blob-3: linear-gradient(135deg, #312e81, #0284c7);
            --network-color: 59, 130, 246;
            /* RGB format untuk transparansi JS */
            --text-color: #ffffff;
        }

        /* --- TEMA BRIGHT BLUE --- */
        body.bright-theme {
            --bg-base: #e0f2fe;
            --blob-1: linear-gradient(135deg, #60a5fa, #93c5fd);
            --blob-2: linear-gradient(135deg, #38bdf8, #bae6fd);
            --blob-3: linear-gradient(135deg, #7dd3fc, #bfdbfe);
            --network-color: 2, 132, 199;
            --text-color: #0f172a;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-base);
            transition: background-color 0.8s ease;
        }

        /* --- WADAH BACKGROUND --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            /* Berada di belakang konten */
            overflow: hidden;
        }

        /* --- ANIMASI BLOB --- */
        .blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.6;
            border-radius: 50%;
            animation: morphBlob 15s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 60vw;
            height: 60vw;
            background: var(--blob-1);
            top: -20%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 50vw;
            height: 50vw;
            background: var(--blob-2);
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 45vw;
            height: 45vw;
            background: var(--blob-3);
            top: 30%;
            left: 40%;
            animation-delay: -10s;
        }

        @keyframes morphBlob {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }

            33% {
                transform: translate(5vw, 5vh) scale(1.1) rotate(15deg);
                border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%;
            }

            66% {
                transform: translate(-5vw, 10vh) scale(0.9) rotate(-5deg);
                border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
            }

            100% {
                transform: translate(8vw, -5vh) scale(1.05) rotate(10deg);
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
        }

        /* --- CANVAS JARINGAN (NETWORK) --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Di atas blob, di bawah konten */
        }

        /* --- KONTEN UI (Hanya untuk demo) --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-color);
            transition: color 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            cursor: pointer;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-base);
        }
    </style>
</head>

<body>

    <!-- Container untuk Background -->
    <div class="bg-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <canvas id="networkCanvas"></canvas>
    </div>

    <!-- Konten Utama Halaman -->
    <div class="content">
        <h1>DATA NETWORK SYSTEM</h1>
        <button onclick="toggleTheme()">Switch to Bright Blue</button>
    </div>

    <script>
        /* --- LOGIKA TOGGLE TEMA --- */
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('button');
            body.classList.toggle('bright-theme');

            if (body.classList.contains('bright-theme')) {
                btn.innerText = "Switch to Dark Blue";
                updateNetworkColor('2, 132, 199');
            } else {
                btn.innerText = "Switch to Bright Blue";
                updateNetworkColor('59, 130, 246');
            }
        }

        /* --- LOGIKA CANVAS JARINGAN (PARTICLES) --- */
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        // Warna default garis jaringan
        let netR = 59, netG = 130, netB = 246;

        function updateNetworkColor(rgbString) {
            const rgb = rgbString.split(',').map(Number);
            netR = rgb[0]; netG = rgb[1]; netB = rgb[2];
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        class Particle {
            constructor(x, y, directionX, directionY, size) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
            }
            // Menggambar simpul/titik
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = `rgba(${netR}, ${netG}, ${netB}, 0.8)`;
                ctx.fill();
            }
            // Memperbarui posisi
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 12000;
            // Batasi jumlah partikel agar tidak memberatkan browser
            if (numberOfParticles > 150) numberOfParticles = 150;

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 1.5) + 0.5;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.8) - 0.4;
                let directionY = (Math.random() * 0.8) - 0.4;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // Menggambar garis antar titik jika jaraknya berdekatan
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                        + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));

                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        if (opacityValue < 0) opacityValue = 0;

                        ctx.strokeStyle = `rgba(${netR}, ${netG}, ${netB}, ${opacityValue * 0.4})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        init();
        animate();
    </script>
</body>

</html>
